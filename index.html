<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>누나를 위한 작은 선물 ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0408;
      --bg-wine: #1d0811;
      --rose-crimson: #9e1b32;
      --rose-ruby: #d62848;
      --rose-blush: #ff758f;
      --rose-soft: #ffb3c1;
      --gold-light: #f6e2b3;
      --gold-warm: #d4af37;
      --text-cream: #fff5f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #260a16 0%, #11050b 55%, #070204 100%);
      color: var(--text-cream);
      font-family: 'Gowun Batang', 'Noto Serif KR', serif;
      user-select: none;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(214, 40, 72, 0.55), transparent 70%);
      top: -60px;
      left: -50px;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.25), transparent 70%);
      bottom: -80px;
      right: -60px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 117, 143, 0.35), transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, -25px) scale(1.15); }
    }

    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(36, 9, 20, 0.85), rgba(8, 2, 5, 0.96));
      transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1), transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #intro-screen.hidden {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
    }

    .crest-ring {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 1px solid rgba(246, 226, 179, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      position: relative;
      box-shadow: 0 0 35px rgba(214, 40, 72, 0.3), inset 0 0 20px rgba(246, 226, 179, 0.12);
      animation: pulseRing 3.2s ease-in-out infinite;
    }

    .crest-ring::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1px dashed rgba(246, 226, 179, 0.35);
      animation: spinSlow 24s linear infinite;
    }

    .crest-icon {
      font-size: 32px;
      filter: drop-shadow(0 0 12px rgba(255, 117, 143, 0.7));
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); box-shadow: 0 0 28px rgba(214, 40, 72, 0.25); }
      50% { transform: scale(1.05); box-shadow: 0 0 46px rgba(255, 117, 143, 0.45); }
    }

    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    .subtitle-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      letter-spacing: 3px;
      font-size: 13px;
      color: var(--gold-light);
      opacity: 0.75;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .intro-hint {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255, 245, 247, 0.82);
      margin-bottom: 38px;
      font-weight: 400;
      letter-spacing: 0.03em;
    }

    .gift-btn {
      position: relative;
      padding: 18px 34px;
      font-family: 'Gowun Batang', serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff8f9;
      background: linear-gradient(135deg, #7d1128 0%, #b81d3a 50%, #8a142c 100%);
      border: 1px solid rgba(246, 226, 179, 0.55);
      border-radius: 999px;
      cursor: pointer;
      box-shadow:
        0 10px 30px rgba(184, 29, 58, 0.45),
        0 0 22px rgba(246, 226, 179, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
      animation: btnGlow 2.8s ease-in-out infinite;
    }

    .gift-btn::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 45%;
      height: 200%;
      background: linear-gradient(to right, transparent, rgba(255, 248, 225, 0.45), transparent);
      transform: rotate(25deg);
      animation: shimmerSweep 3.8s infinite;
    }

    .gift-btn:active {
      transform: scale(0.95);
    }

    @keyframes shimmerSweep {
      0% { left: -60%; }
      45%, 100% { left: 130%; }
    }

    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 10px 30px rgba(184, 29, 58, 0.45), 0 0 18px rgba(246, 226, 179, 0.18); }
      50% { box-shadow: 0 14px 38px rgba(214, 40, 72, 0.7), 0 0 32px rgba(246, 226, 179, 0.4); }
    }

    #main-stage {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(22px, env(safe-area-inset-top)) 20px max(26px, env(safe-area-inset-bottom));
      opacity: 0;
      transition: opacity 1.2s ease 0.2s;
      pointer-events: none;
    }

    #main-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    .top-header {
      text-align: center;
      margin-top: 4px;
      opacity: 0;
      transform: translateY(-12px);
      transition: all 1s ease 0.5s;
    }

    #main-stage.active .top-header {
      opacity: 1;
      transform: translateY(0);
    }

    .top-header span {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      letter-spacing: 3.5px;
      color: var(--gold-light);
      opacity: 0.8;
    }

    .bouquet-wrapper {
      position: relative;
      width: 100%;
      max-width: 370px;
      height: 44vh;
      min-height: 270px;
      max-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      margin: 4px 0;
    }

    .bouquet-halo {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 117, 143, 0.28) 0%, rgba(212, 175, 55, 0.12) 45%, transparent 72%);
      filter: blur(18px);
      transform: scale(0);
      transition: transform 2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s;
    }

    #main-stage.active .bouquet-halo {
      transform: scale(1.15);
      animation: haloBreath 4s ease-in-out infinite alternate 2s;
    }

    @keyframes haloBreath {
      from { transform: scale(1.08); opacity: 0.75; }
      to { transform: scale(1.24); opacity: 1; }
    }

    #bouquet-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.65));
      transform-style: preserve-3d;
      animation: gentleSway 6s ease-in-out infinite alternate;
    }

    @keyframes gentleSway {
      0% { transform: rotateY(-4deg) rotateZ(-1.2deg) translateY(0px); }
      100% { transform: rotateY(4deg) rotateZ(1.2deg) translateY(-5px); }
    }

    .stem-path {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      transition: stroke-dashoffset 1.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #main-stage.active .stem-path {
      stroke-dashoffset: 0;
    }

    .leaf-item {
      opacity: 0;
      transform: scale(0);
      transform-box: fill-box;
      transform-origin: bottom center;
      transition: transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease;
    }

    #main-stage.active .leaf-item {
      opacity: 1;
      transform: scale(1);
    }

    .wrap-paper {
      opacity: 0;
      transform: translateY(24px) scale(0.92);
      transform-box: fill-box;
      transform-origin: bottom center;
      transition: all 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.3s;
    }

    #main-stage.active .wrap-paper {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .ribbon-bow {
      opacity: 0;
      transform: scale(0.4);
      transform-box: fill-box;
      transform-origin: center;
      transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 1s;
    }

    #main-stage.active .ribbon-bow {
      opacity: 1;
      transform: scale(1);
    }

    .rose-bloom {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      transform: scale(0.05) rotate(-25deg);
      transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease;
    }

    #main-stage.active .rose-bloom {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .rose-petal-layer {
      transform-box: fill-box;
      transform-origin: center;
      animation: petalBreathe 4.5s ease-in-out infinite alternate;
    }

    @keyframes petalBreathe {
      0% { transform: scale(0.97) rotate(-1.5deg); }
      100% { transform: scale(1.04) rotate(1.5deg); }
    }

    .letter-card {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(160deg, rgba(38, 12, 23, 0.72) 0%, rgba(18, 5, 11, 0.84) 100%);
      border: 1px solid rgba(246, 226, 179, 0.28);
      border-radius: 22px;
      padding: 20px 22px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 0 24px rgba(255, 117, 143, 0.08);
      text-align: center;
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease 1.1s;
    }

    #main-stage.active .letter-card {
      opacity: 1;
      transform: translateY(0);
    }

    .letter-card::before {
      content: "✦";
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a0710;
      color: var(--gold-light);
      padding: 0 10px;
      font-size: 13px;
    }

    #typed-message {
      font-size: 15.5px;
      line-height: 1.85;
      color: #fff4f6;
      min-height: 115px;
      white-space: pre-line;
      word-break: keep-all;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background-color: var(--gold-light);
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: blinkCursor 0.85s infinite;
    }

    .typing-cursor.done {
      display: none;
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .final-surprise {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(246, 226, 179, 0.22);
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      transition: all 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .final-surprise.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .final-surprise p {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, #ffd1dc, #f6e2b3, #ff9ebb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(255, 117, 143, 0.45));
      letter-spacing: 0.03em;
      word-break: keep-all;
    }

    .tap-hint {
      font-size: 11.5px;
      color: rgba(246, 226, 179, 0.55);
      margin-top: 8px;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .tap-hint.visible {
      opacity: 1;
    }

    @media (max-height: 680px) {
      .bouquet-wrapper {
        height: 38vh;
        min-height: 220px;
      }
      .letter-card {
        padding: 15px 18px;
      }
      #typed-message {
        font-size: 14.5px;
        line-height: 1.7;
        min-height: 98px;
      }
      .final-surprise p {
        font-size: 15.5px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <canvas id="fxCanvas"></canvas>

  <section id="intro-screen">
    <div class="crest-ring">
      <span class="crest-icon">🌹</span>
    </div>
    <div class="subtitle-en">For Someone Truly Special</div>
    <p class="intro-hint">조용히 마음을 담아 준비했어요.<br>아래 버튼을 눌러 열어보세요.</p>
    <button id="open-btn" class="gift-btn" type="button">누나를 위한 작은 선물 ❤️</button>
  </section>

  <main id="main-stage">
    <header class="top-header">
      <span>Only For You</span>
    </header>

    <div class="bouquet-wrapper" id="bouquet-touch">
      <div class="bouquet-halo"></div>
      <svg id="bouquet-svg" viewBox="0 0 360 390" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="redOuter" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ff4d6d"/>
            <stop offset="45%" stop-color="#c9184a"/>
            <stop offset="85%" stop-color="#800f2f"/>
            <stop offset="100%" stop-color="#4a071a"/>
          </radialGradient>
          <radialGradient id="redInner" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ff758f"/>
            <stop offset="50%" stop-color="#a4133c"/>
            <stop offset="100%" stop-color="#590d22"/>
          </radialGradient>
          <radialGradient id="pinkOuter" cx="35%" cy="28%" r="72%">
            <stop offset="0%" stop-color="#ffe5ec"/>
            <stop offset="45%" stop-color="#ff8fab"/>
            <stop offset="85%" stop-color="#fb6f92"/>
            <stop offset="100%" stop-color="#b53858"/>
          </radialGradient>
          <radialGradient id="pinkInner" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#fff0f3"/>
            <stop offset="55%" stop-color="#ff758f"/>
            <stop offset="100%" stop-color="#c9184a"/>
          </radialGradient>
          <linearGradient id="wrapBack" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b1222"/>
            <stop offset="100%" stop-color="#1c060f"/>
          </linearGradient>
          <linearGradient id="wrapFrontLeft" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#591c34"/>
            <stop offset="60%" stop-color="#360e1e"/>
            <stop offset="100%" stop-color="#210712"/>
          </linearGradient>
          <linearGradient id="wrapFrontRight" x1="100%" y1="0%" x2="0%" y2="80%">
            <stop offset="0%" stop-color="#6b223e"/>
            <stop offset="60%" stop-color="#3d1022"/>
            <stop offset="100%" stop-color="#240813"/>
          </linearGradient>
          <linearGradient id="goldSilk" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff0c2"/>
            <stop offset="45%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#99771d"/>
          </linearGradient>
          <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3a6b4c"/>
            <stop offset="60%" stop-color="#1e422c"/>
            <stop offset="100%" stop-color="#102619"/>
          </linearGradient>

          <g id="rose-red-model">
            <ellipse cx="0" cy="4" rx="34" ry="31" fill="rgba(0,0,0,0.35)"/>
            <g class="rose-petal-layer">
              <path d="M0,-34 C22,-34 36,-16 32,6 C28,26 12,35 0,34 C-14,35 -30,24 -32,4 C-35,-16 -20,-34 0,-34 Z" fill="url(#redOuter)"/>
              <path d="M-26,-10 C-34,6 -20,28 0,29 C20,30 33,10 25,-8 C16,-22 -16,-22 -26,-10 Z" fill="url(#redInner)" opacity="0.92"/>
              <path d="M-19,-16 C-8,-28 14,-26 21,-12 C26,0 16,18 0,19 C-16,19 -25,2 -19,-16 Z" fill="url(#redOuter)"/>
              <path d="M-12,-10 C-4,-20 12,-17 15,-6 C18,5 8,14 -2,13 C-12,12 -17,0 -12,-10 Z" fill="url(#redInner)"/>
              <path d="M-6,-5 C0,-12 9,-9 9,-1 C9,6 1,9 -4,6 C-9,3 -9,-1 -6,-5 Z" fill="#ff8fa3" opacity="0.75"/>
              <path d="M-3,-2 C1,-6 6,-4 5,1 C4,4 -1,5 -3,2 Z" fill="#4a071a"/>
            </g>
          </g>

          <g id="rose-pink-model">
            <ellipse cx="0" cy="4" rx="31" ry="29" fill="rgba(0,0,0,0.3)"/>
            <g class="rose-petal-layer" style="animation-delay: -1.4s;">
              <path d="M0,-31 C20,-31 33,-14 29,6 C25,24 11,32 0,31 C-13,32 -27,22 -29,4 C-32,-14 -18,-31 0,-31 Z" fill="url(#pinkOuter)"/>
              <path d="M-23,-9 C-30,5 -18,25 0,26 C18,27 30,9 22,-7 C14,-20 -14,-20 -23,-9 Z" fill="url(#pinkInner)" opacity="0.94"/>
              <path d="M-17,-14 C-7,-25 12,-23 19,-10 C23,0 14,16 0,17 C-14,17 -22,2 -17,-14 Z" fill="url(#pinkOuter)"/>
              <path d="M-10,-9 C-3,-17 10,-15 13,-5 C15,4 7,12 -2,11 C-10,10 -15,0 -10,-9 Z" fill="url(#pinkInner)"/>
              <path d="M-4,-4 C1,-10 8,-7 7,0 C6,5 0,7 -4,4 Z" fill="#fff0f3" opacity="0.85"/>
            </g>
          </g>
        </defs>

        <g class="wrap-paper">
          <polygon points="180,68 78,175 180,355 282,175" fill="url(#wrapBack)" stroke="rgba(246,226,179,0.35)" stroke-width="1.2"/>
          <polygon points="180,82 95,178 180,342 265,178" fill="none" stroke="rgba(246,226,179,0.22)" stroke-width="0.9"/>
        </g>

        <g stroke="#295238" stroke-width="4" stroke-linecap="round" fill="none">
          <path class="stem-path" style="transition-delay:0.2s" d="M180,335 Q176,230 180,128"/>
          <path class="stem-path" style="transition-delay:0.3s" d="M180,335 Q152,240 130,148"/>
          <path class="stem-path" style="transition-delay:0.35s" d="M180,335 Q208,240 230,148"/>
          <path class="stem-path" style="transition-delay:0.4s" d="M180,335 Q138,255 104,185"/>
          <path class="stem-path" style="transition-delay:0.45s" d="M180,335 Q222,255 256,185"/>
          <path class="stem-path" style="transition-delay:0.5s" d="M180,335 Q165,245 152,188"/>
          <path class="stem-path" style="transition-delay:0.55s" d="M180,335 Q195,245 208,188"/>
        </g>

        <g fill="url(#leafGrad)" stroke="rgba(246,226,179,0.2)" stroke-width="0.7">
          <path class="leaf-item" style="transition-delay:0.6s" d="M112,162 C82,146 68,162 84,182 C98,194 114,180 112,162 Z"/>
          <path class="leaf-item" style="transition-delay:0.65s" d="M248,162 C278,146 292,162 276,182 C262,194 246,180 248,162 Z"/>
          <path class="leaf-item" style="transition-delay:0.7s" d="M142,126 C122,102 102,110 110,132 C118,146 136,140 142,126 Z"/>
          <path class="leaf-item" style="transition-delay:0.75s" d="M218,126 C238,102 258,110 250,132 C242,146 224,140 218,126 Z"/>
          <path class="leaf-item" style="transition-delay:0.8s" d="M96,204 C68,200 62,220 82,230 C98,236 106,218 96,204 Z"/>
          <path class="leaf-item" style="transition-delay:0.85s" d="M264,204 C292,200 298,220 278,230 C262,236 254,218 264,204 Z"/>
        </g>

        <g fill="#fff3d6" opacity="0.85">
          <circle class="leaf-item" style="transition-delay:1.1s" cx="154" cy="116" r="2.8"/>
          <circle class="leaf-item" style="transition-delay:1.15s" cx="206" cy="116" r="2.8"/>
          <circle class="leaf-item" style="transition-delay:1.2s" cx="105" cy="158" r="2.5"/>
          <circle class="leaf-item" style="transition-delay:1.25s" cx="255" cy="158" r="2.5"/>
          <circle class="leaf-item" style="transition-delay:1.3s" cx="180" cy="162" r="3"/>
          <circle class="leaf-item" style="transition-delay:1.35s" cx="128" cy="212" r="2.5"/>
          <circle class="leaf-item" style="transition-delay:1.4s" cx="232" cy="212" r="2.5"/>
        </g>

        <g transform="translate(132, 142)">
          <g class="rose-bloom" style="transition-delay: 0.65s;">
            <use href="#rose-pink-model" transform="scale(0.95)"/>
          </g>
        </g>
        <g transform="translate(228, 142)">
          <g class="rose-bloom" style="transition-delay: 0.75s;">
            <use href="#rose-pink-model" transform="scale(0.95)"/>
          </g>
        </g>
        <g transform="translate(180, 124)">
          <g class="rose-bloom" style="transition-delay: 0.55s;">
            <use href="#rose-red-model" transform="scale(1.06)"/>
          </g>
        </g>
        <g transform="translate(104, 184)">
          <g class="rose-bloom" style="transition-delay: 0.85s;">
            <use href="#rose-red-model" transform="scale(0.92)"/>
          </g>
        </g>
        <g transform="translate(256, 184)">
          <g class="rose-bloom" style="transition-delay: 0.95s;">
            <use href="#rose-red-model" transform="scale(0.92)"/>
          </g>
        </g>
        <g transform="translate(150, 184)">
          <g class="rose-bloom" style="transition-delay: 1.05s;">
            <use href="#rose-red-model" transform="scale(1.05)"/>
          </g>
        </g>
        <g transform="translate(210, 184)">
          <g class="rose-bloom" style="transition-delay: 1.15s;">
            <use href="#rose-pink-model" transform="scale(1.03)"/>
          </g>
        </g>
        <g transform="translate(180, 214)">
          <g class="rose-bloom" style="transition-delay: 1.25s;">
            <use href="#rose-red-model" transform="scale(0.98)"/>
          </g>
        </g>

        <g class="wrap-paper">
          <path d="M84,186 L180,256 L180,358 L112,262 Z" fill="url(#wrapFrontLeft)" stroke="rgba(246,226,179,0.45)" stroke-width="1.2"/>
          <path d="M276,186 L180,256 L180,358 L248,262 Z" fill="url(#wrapFrontRight)" stroke="rgba(246,226,179,0.45)" stroke-width="1.2"/>
        </g>

        <g class="ribbon-bow">
          <path d="M174,276 Q154,318 142,348 L155,342 Q166,314 178,280 Z" fill="url(#goldSilk)"/>
          <path d="M186,276 Q206,318 218,348 L205,342 Q194,314 182,280 Z" fill="url(#goldSilk)"/>
          <path d="M176,274 C144,252 134,284 174,280 Z" fill="url(#goldSilk)" stroke="#8c6814" stroke-width="0.6"/>
          <path d="M184,274 C216,252 226,284 186,280 Z" fill="url(#goldSilk)" stroke="#8c6814" stroke-width="0.6"/>
          <rect x="173" y="269" width="14" height="14" rx="5" fill="#fff0c2" stroke="#b58e26" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <section class="letter-card">
      <div id="typed-message"><span id="message-text"></span><span id="cursor" class="typing-cursor"></span></div>
      <div id="final-surprise" class="final-surprise">
        <p>이 꽃들보다 누나가 더 아름다워요 ❤️</p>
      </div>
      <div id="tap-hint" class="tap-hint">화면을 터치하면 꽃잎과 하트가 피어나요 ✨</div>
    </section>
  </main>

  <script>
    const openBtn = document.getElementById('open-btn');
    const introScreen = document.getElementById('intro-screen');
    const mainStage = document.getElementById('main-stage');
    const messageTextEl = document.getElementById('message-text');
    const cursorEl = document.getElementById('cursor');
    const finalSurpriseEl = document.getElementById('final-surprise');
    const tapHintEl = document.getElementById('tap-hint');

    const romanticMessage =
      "오늘도 누나를 생각했어요.\n" +
      "누나의 미소는 제 하루를 특별하게 만들어요.\n" +
      "항상 예쁘게 웃어줘서 고마워요.\n" +
      "그리고 앞으로도 누나를 많이 웃게 해주고 싶어요. ❤️";

    let experienceStarted = false;

    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const petalColors = [
      ['#ff4d6d', '#a4133c'],
      ['#ff758f', '#c9184a'],
      ['#ffb3c1', '#fb6f92'],
      ['#d62848', '#6e0d25']
    ];

    class Particle {
      constructor(type, x, y, burst = false) {
        this.type = type;
        this.x = x !== undefined ? x : Math.random() * width;
        this.y = y !== undefined ? y : (type === 'heart' ? height + 20 : -20);
        this.burst = burst;

        if (type === 'petal') {
          this.size = Math.random() * 8 + 7;
          this.vx = burst ? (Math.random() - 0.5) * 6 : (Math.random() - 0.5) * 1.1;
          this.vy = burst ? (Math.random() - 0.7) * 5 : Math.random() * 1.4 + 0.8;
          this.rot = Math.random() * Math.PI * 2;
          this.vRot = (Math.random() - 0.5) * 0.05;
          this.swayPhase = Math.random() * Math.PI * 2;
          this.colors = petalColors[Math.floor(Math.random() * petalColors.length)];
          this.alpha = Math.random() * 0.35 + 0.65;
        } else if (type === 'heart') {
          this.size = Math.random() * 9 + 7;
          this.vx = burst ? (Math.random() - 0.5) * 5 : (Math.random() - 0.5) * 0.8;
          this.vy = burst ? -(Math.random() * 4 + 1.5) : -(Math.random() * 1.3 + 0.7);
          this.alpha = 1;
          this.fade = burst ? 0.015 : 0.0045;
          this.color = Math.random() > 0.4 ? '#ff758f' : '#ffb3c1';
        } else {
          this.size = Math.random() * 2.4 + 1;
          this.vx = burst ? (Math.random() - 0.5) * 4 : (Math.random() - 0.5) * 0.3;
          this.vy = burst ? (Math.random() - 0.5) * 4 : -(Math.random() * 0.4 + 0.1);
          this.alpha = Math.random();
          this.twinkleSpeed = Math.random() * 0.04 + 0.015;
          this.life = burst ? 70 : 9999;
        }
      }

      update() {
        if (this.type === 'petal') {
          this.swayPhase += 0.025;
          if (this.burst) {
            this.vx *= 0.96;
            this.vy += 0.06;
          }
          this.x += this.vx + Math.sin(this.swayPhase) * 0.65;
          this.y += this.vy;
          this.rot += this.vRot;
        } else if (this.type === 'heart') {
          if (this.burst) {
            this.vx *= 0.96;
          }
          this.x += this.vx + Math.sin(this.y * 0.03) * 0.4;
          this.y += this.vy;
          this.alpha -= this.fade;
        } else {
          this.x += this.vx;
          this.y += this.vy;
          this.alpha += Math.sin(Date.now() * this.twinkleSpeed) * 0.03;
          this.life--;
        }
      }

      draw() {
        ctx.save();
        if (this.type === 'petal') {
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rot);
          ctx.globalAlpha = Math.max(0, this.alpha);
          const grad = ctx.createRadialGradient(0, -this.size * 0.3, 1, 0, 0, this.size);
          grad.addColorStop(0, this.colors[0]);
          grad.addColorStop(1, this.colors[1]);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, -this.size);
          ctx.bezierCurveTo(this.size * 0.95, -this.size * 0.4, this.size * 0.8, this.size * 0.8, 0, this.size);
          ctx.bezierCurveTo(-this.size * 0.8, this.size * 0.8, -this.size * 0.95, -this.size * 0.4, 0, -this.size);
          ctx.fill();
        } else if (this.type === 'heart') {
          ctx.translate(this.x, this.y);
          ctx.globalAlpha = Math.max(0, this.alpha);
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = this.color;
          const s = this.size * 0.55;
          ctx.beginPath();
          ctx.moveTo(0, s * 0.6);
          ctx.bezierCurveTo(-s * 1.4, -s * 0.6, -s * 0.6, -s * 1.7, 0, -s * 0.7);
          ctx.bezierCurveTo(s * 0.6, -s * 1.7, s * 1.4, -s * 0.6, 0, s * 0.6);
          ctx.fill();
        } else {
          const a = Math.max(0.1, Math.min(0.95, this.alpha));
          ctx.globalAlpha = a;
          ctx.shadowColor = '#f6e2b3';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#fff3d1';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 32; i++) {
      particles.push(new Particle('sparkle', Math.random() * width, Math.random() * height));
    }

    function spawnBurst(x, y) {
      for (let i = 0; i < 12; i++) {
        particles.push(new Particle('petal', x, y, true));
      }
      for (let i = 0; i < 8; i++) {
        particles.push(new Particle('heart', x, y, true));
      }
      for (let i = 0; i < 14; i++) {
        particles.push(new Particle('sparkle', x, y, true));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);

      if (experienceStarted) {
        if (Math.random() < 0.24) {
          particles.push(new Particle('petal'));
        }
        if (Math.random() < 0.08) {
          particles.push(new Particle('heart'));
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (
          (p.type === 'petal' && p.y > height + 30) ||
          (p.type === 'heart' && (p.alpha <= 0 || p.y < -40)) ||
          (p.type === 'sparkle' && p.life <= 0)
        ) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function startTyping(text, speed = 58) {
      let index = 0;
      function typeNext() {
        if (index < text.length) {
          const char = text[index];
          messageTextEl.textContent += char;
          index++;
          const pause = (char === '.' || char === '\n') ? 320 : speed;
          setTimeout(typeNext, pause);
        } else {
          cursorEl.classList.add('done');
          setTimeout(() => {
            finalSurpriseEl.classList.add('visible');
            spawnBurst(width * 0.5, height * 0.42);
            setTimeout(() => {
              tapHintEl.classList.add('visible');
            }, 800);
          }, 450);
        }
      }
      typeNext();
    }

    function revealGift() {
      if (experienceStarted) return;
      experienceStarted = true;

      spawnBurst(width * 0.5, height * 0.5);
      introScreen.classList.add('hidden');
      mainStage.classList.add('active');

      for (let i = 0; i < 18; i++) {
        particles.push(new Particle('petal', Math.random() * width, Math.random() * height * 0.6));
      }

      setTimeout(() => {
        startTyping(romanticMessage, 58);
      }, 1500);
    }

    openBtn.addEventListener('click', revealGift);
    openBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      revealGift();
    }, { passive: false });

    document.addEventListener('pointerdown', (e) => {
      if (!experienceStarted) return;
      spawnBurst(e.clientX, e.clientY);
    });
  </script>
</body>
